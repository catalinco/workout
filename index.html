<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Workout Program 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-size: 1.25rem; }
    .nav-btn { min-width: 48px; min-height: 48px; font-size: 1.5rem; }
    .nav-btn:disabled { opacity: 0.3; }
    #weekText, #dayText { font-size: 1.3rem; }
    #programName { font-size: 0.9rem; }
    .table { font-size: 1.5rem; }
    .form-check-input { width: 1.5em; height: 1.5em; }
    .rest-row { color: #999; font-style: italic; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-3">
    <div class="mb-2 d-flex align-items-center justify-content-center position-relative">
      <div class="d-flex align-items-center gap-2">
        <button id="weekPrev" class="btn btn-outline-secondary nav-btn" onclick="change('week',-1)"><i class="bi bi-chevron-left"></i></button>
        <span id="weekText" class="fw-bold" style="min-width:70px;text-align:center"></span>
        <button id="weekNext" class="btn btn-outline-secondary nav-btn" onclick="change('week',1)"><i class="bi bi-chevron-right"></i></button>
      </div>
      <button class="btn btn-link fs-4 p-0 position-absolute end-0" data-bs-toggle="modal" data-bs-target="#settingsModal"><i class="bi bi-gear"></i></button>
    </div>
    <div class="mb-3 d-flex align-items-center justify-content-center gap-3">
      <button id="dayPrev" class="btn btn-outline-secondary nav-btn" onclick="change('day',-1)"><i class="bi bi-chevron-left"></i></button>
      <span id="dayText" class="text-center fw-bold" style="min-width:220px"></span>
      <button id="dayNext" class="btn btn-outline-secondary nav-btn" onclick="change('day',1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <table class="table table-striped">
      <thead class="table-dark"><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th></th></tr></thead>
      <tbody id="exercises"></tbody>
    </table>
  </div>

  <div class="modal fade" id="settingsModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="bi bi-gear"></i> Settings</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="programList" class="list-group mb-3"></div><button class="btn btn-outline-primary w-100 mb-3" onclick="confirmProgram()">OK</button><div class="text-center"><button class="btn btn-outline-danger" onclick="confirmReset()">Reset Program Progress</button></div></div></div></div></div>
  <div class="modal fade" id="confirmModal"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-body text-center py-4"><p>Reset all progress for this program?</p><div class="d-flex gap-2 justify-content-center"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" onclick="resetProgress()">Reset</button></div></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
