<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Workout Program 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-size: 1.25rem; }
    .nav-btn { min-width: 48px; min-height: 48px; font-size: 1.5rem; }
    #weekText, #dayText { font-size: 1.3rem; }
    .table { font-size: 1.5rem; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-3 position-relative">
    <button class="btn btn-link position-absolute top-0 end-0 fs-4" data-bs-toggle="modal" data-bs-target="#settingsModal"><i class="bi bi-gear"></i></button>
    <div class="mb-2 d-flex align-items-center justify-content-center gap-3">
      <button class="btn btn-outline-secondary nav-btn" onclick="change('week',-1)"><i class="bi bi-chevron-left"></i></button>
      <span id="weekText" class="text-center fw-bold" style="min-width:80px"></span>
      <button class="btn btn-outline-secondary nav-btn" onclick="change('week',1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="mb-3 d-flex align-items-center justify-content-center gap-3">
      <button class="btn btn-outline-secondary nav-btn" onclick="change('day',-1)"><i class="bi bi-chevron-left"></i></button>
      <span id="dayText" class="text-center fw-bold" style="min-width:180px"></span>
      <button class="btn btn-outline-secondary nav-btn" onclick="change('day',1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <table class="table table-striped">
      <thead class="table-dark"><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th></th></tr></thead>
      <tbody id="exercises"></tbody>
    </table>
  </div>

  <div class="modal fade" id="settingsModal"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Settings</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label fw-bold">Program</label><select id="programSelect" class="form-select mb-3" onchange="selectProgram(this.value)"></select><div class="text-center"><button class="btn btn-danger" onclick="resetProgress()">Reset All Progress</button></div></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
