<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Program 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-size: 1.25rem; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
    .nav-btn { min-width: 48px; min-height: 48px; font-size: 1.5rem; background: #0f3460; border-color: #e94560; color: #fff; }
    .nav-btn:hover { background: #e94560; border-color: #e94560; color: #fff; }
    #weekText, #dayText { font-size: 1.3rem; color: #e94560; }
    h1 { color: #fff; }
    .table { color: #fff; }
    .table-dark { background: #0f3460; }
    .table-striped > tbody > tr:nth-of-type(odd) { background-color: rgba(233, 69, 96, 0.1); color: #fff; }
    .table-striped > tbody > tr:nth-of-type(even) { background-color: rgba(15, 52, 96, 0.5); color: #fff; }
  </style>
</head>
<body>
  <div class="container py-3">
    <h1 class="mb-3 fs-4">4-Day Program 2026</h1>
    <div class="mb-2 d-flex align-items-center justify-content-center gap-3">
      <button class="btn btn-outline-secondary nav-btn" onclick="change('week',-1)"><i class="bi bi-chevron-left"></i></button>
      <span id="weekText" class="text-center fw-bold" style="min-width:80px"></span>
      <button class="btn btn-outline-secondary nav-btn" onclick="change('week',1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="mb-3 d-flex align-items-center justify-content-center gap-3">
      <button class="btn btn-outline-secondary nav-btn" onclick="change('day',-1)"><i class="bi bi-chevron-left"></i></button>
      <span id="dayText" class="text-center fw-bold" style="min-width:180px"></span>
      <button class="btn btn-outline-secondary nav-btn" onclick="change('day',1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <table class="table table-striped">
      <thead class="table-dark"><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr></thead>
      <tbody id="exercises"></tbody>
    </table>
  </div>

  <script>
    let program;
    let week = +(localStorage.getItem('week') || 0);
    let day = +(localStorage.getItem('day') || 0);

    fetch('program.json')
      .then(r => r.json())
      .then(data => { program = data; render(); });

    function change(type, delta) {
      if (type === 'week') week = Math.max(0, Math.min(5, week + delta));
      else day = Math.max(0, Math.min(3, day + delta));
      render();
    }

    function render() {
      if (!program) return;
      localStorage.setItem('week', week);
      localStorage.setItem('day', day);
      document.getElementById('weekText').textContent = `Week ${week + 1}`;
      document.getElementById('dayText').textContent = program.days[day].name;
      document.getElementById('exercises').innerHTML = program.days[day].exercises
        .map(e => { const [s,r] = e.weeks[week].split('x'); return `<tr><td>${e.name}</td><td>${s}</td><td>${r}</td></tr>`; }).join('');
    }
  </script>
</body>
</html>
